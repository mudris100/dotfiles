[general]
import = ["~/git-hub/dotfiles/alacritty/themes/one_dark.toml"]
#import = ["~/git-hub/dotfiles/alacritty/themes/pencil_light.toml"]

[font]
size = 12.0

[window]
startup_mode = "Maximized"
opacity = 1.0
decorations = "full" 

[keyboard]
bindings = [
  { key = "F11", action = "ToggleFullscreen" },
]

[window.padding]
x = 5
y = 5

[terminal]
# Allows remote commands (like tmux OSC 52) to set the OS clipboard
osc52 = "OnlyCopy"

[env]
TERM = "xterm-256color"

[selection]
save_to_clipboard = true
