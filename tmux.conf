# --- Core Settings ---
setw -g mode-keys vi
set -g status-keys vi
set -g default-terminal "tmux-256color"
set -sg escape-time 10
set -g history-limit 50000
bind-key L clear-history
set -s set-clipboard on

# Vim-like copy/paste bindings
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection-and-cancel

# Reload config quickly
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Split panes using v and h
bind v split-window -h
bind - split-window -v

# Better pane switching with Alt + arrow keys
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

set -g mouse on

# Theme Nord
set-window-option -g window-status-current-style bold,bg=colour67,fg=colour234
set-window-option -g window-status-style fg=colour67
set -g window-status-activity-style bold,bg=colour109,fg=colour234
set-option -g message-style bg=colour236,fg=colour188
set-option -g pane-border-style fg=colour60
set-option -g pane-active-border-style fg=colour67

# Status Bar
set -g status-justify centre
set -g status-bg colour236
set -g status-fg colour67
set -g status-interval 60
set -g status-left-length 50
set -g status-left "#[bg=colour67,fg=colour234] 💻 #[fg=colour234,bold]#H #[fg=colour188] [#S]"
set -g status-right "#[bg=colour67,fg=colour234] ⏰ #[fg=colour234,bold]%H:%M "
