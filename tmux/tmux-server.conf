# --- Common Core Settings ---
setw -g mode-keys vi
set -g status-keys vi
set -g default-terminal "tmux-256color"
set -a terminal-features '*:RGB'
set -sg escape-time 10
set -s set-clipboard on
set -g mouse on
set -g history-limit 10000

# Pass focus events through to terminal applications (Vim/Neovim)
set -g focus-events on

# Update terminal window titles
set -g set-titles on

# Highlight window status bar on background activity
setw -g monitor-activity on


# --- Common Bindings ---
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload config quickly
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Theme: Tokyo Night
set-window-option -g window-status-current-style bold,bg=colour111,fg=colour234
set-window-option -g window-status-style fg=colour111
set -g window-status-activity-style bold,bg=colour117,fg=colour234
set-option -g message-style bg=colour236,fg=colour253
set-option -g pane-border-style fg=colour60
set-option -g pane-active-border-style fg=colour111

# Status Bar
set -g status-justify centre
set -g status-bg colour234
set -g status-fg colour111
set -g status-interval 60
set -g status-left-length 20
set -g status-left "#[bg=colour111,fg=colour234] 💻 #[fg=colour234,bold]#H #[fg=colour234] [#S]"
set -g status-right "#[bg=colour111,fg=colour234] ⏰ #[fg=colour234,bold]%H:%M "

