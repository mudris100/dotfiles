# --- Common Core Settings ---
setw -g mode-keys vi
set -g status-keys vi
set -g default-terminal "tmux-256color"
set -a terminal-features '*:RGB'
set -sg escape-time 10
set -s set-clipboard on
set -g mouse on
set -g history-limit 10000

# Pass focus events through to terminal applications (Vim/Neovim)
set -g focus-events on

# Update terminal window titles
set -g set-titles on

# Highlight window status bar on background activity
setw -g monitor-activity on

# Allow terminal escape sequences (OSC 52) to pass through outer tmux
set -g allow-passthrough on

# --- Common Bindings ---
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind-key L clear-history

# Synchronize panes
bind-key y set-window-option synchronize-panes\; display-message "synchronize mode toggled."

# Reload config quickly
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Better pane switching with Alt + arrow keys
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# Easily reorder windows with CTRL+SHIFT+Arrow
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

# Theme
set-window-option -g window-status-current-style bold,bg=colour35,fg=colour234
set-window-option -g window-status-style fg=colour35
set -g window-status-activity-style bold,bg=colour39,fg=colour234
set-option -g message-style bg=colour237,fg=colour231
set-option -g pane-border-style fg=colour36
set-option -g pane-active-border-style fg=colour35

# Status Bar
set -g status-justify centre
set -g status-bg black
set -g status-fg colour35
set -g status-interval 60
set -g status-left-length 20
set -g status-left "#[bg=colour35,fg=colour234] 💻 #[fg=colour234,bold]#H #[fg=colour234] [#S]"
set -g status-right "#[bg=colour35,fg=colour234] ⏰ #[fg=colour234,bold]%H:%M "
